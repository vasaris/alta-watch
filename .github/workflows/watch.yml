name: alta-watch

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alta-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check official sources and post news
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watch.py

      - name: Save state
        run: |
          git config user.name "alta-watch bot"
          git config user.email "alta-watch@users.noreply.github.com"
          git add state/seen.json
          if git diff --cached --quiet; then
            echo "Состояние не изменилось"
          else
            git commit -m "state: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi
