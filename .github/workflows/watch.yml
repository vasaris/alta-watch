name: alta-watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force_urls:
        description: "Опубликовать эти ссылки принудительно (через запятую). На время ручного прогона выключите внешний будильник."
        required: false
        default: ""
      backfill:
        description: "Выложить подборки прессы за 48 ч, включая уже виденное (1 = да)"
        required: false
        default: ""

permissions:
  contents: write

# Один публикатор: все отправляющие запуски в одной очереди.
concurrency:
  group: alta-watch-publisher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # свежий main на момент старта, а не SHA из очереди

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check sources and post news
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE_URLS: ${{ github.event.inputs.force_urls }}
          BACKFILL: ${{ github.event.inputs.backfill }}
        run: python watch.py

      - name: Save state
        if: always()
        run: |
          git config user.name "alta-watch bot"
          git config user.email "alta-watch@users.noreply.github.com"
          if git diff --quiet -- state/seen.json; then
            echo "Состояние не изменилось"
            exit 0
          fi
          cp state/seen.json /tmp/ours.json
          for i in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python merge_state.py /tmp/ours.json state/seen.json state/seen.json
            git add state/seen.json
            if git diff --cached --quiet; then
              echo "После слияния изменений нет"
              exit 0
            fi
            git commit -m "state: $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push; then
              exit 0
            fi
            echo "push не прошёл (гонка), попытка $i"
            sleep $((i * 5))
          done
          echo "::error::Состояние не сохранилось после 4 попыток"
          exit 1

      - name: Health ping
        if: success()
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -n "$HEALTHCHECK_URL" ]; then
            curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL" > /dev/null || echo "health ping не прошёл"
          fi
