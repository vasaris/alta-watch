name: alta-watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force_urls:
        description: "Опубликовать эти ссылки принудительно (через запятую)"
        required: false
        default: ""
      backfill:
        description: "Выложить подборки прессы/Telegram за 48 ч, включая уже виденное (1 = да)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: alta-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check official sources and post news
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE_URLS: ${{ github.event.inputs.force_urls }}
          BACKFILL: ${{ github.event.inputs.backfill }}
        run: python watch.py

      - name: Save state
        run: |
          git config user.name "alta-watch bot"
          git config user.email "alta-watch@users.noreply.github.com"
          git add state/seen.json
          if git diff --cached --quiet; then
            echo "Состояние не изменилось"
          else
            git commit -m "state: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi
