name: tests

# Юнит-тесты на фикстурах — без сети, без ключей, без отправок. Запускаются при изменении кода.
on:
  push:
    paths: ["*.py", "tests/**", "requirements.txt", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["*.py", "tests/**", "requirements.txt"]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
